// dosyası olmayan kısa efektler için sentez sesler
function synth(notes, { type = "triangle", step = 0.07, dur = 0.2, vol = 0.2 } = {}){
  if(audioCtx.state !== "running") return;
  const t0 = audioCtx.currentTime;
  notes.forEach((f, k) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + k * step;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  });
}
const chime   = () => synth([1318.5, 1975.5], { step: .06, dur: .3, vol: .16 });
const fanfare = () => synth([523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98], { type: "square", step: .085, dur: .22, vol: .06 });
const ratchet = q => synth([520 + q * 520], { type: "square", dur: .05, vol: .05 });

const canVibrate = typeof navigator.vibrate === "function";
function haptic(p){ if(canVibrate) try { navigator.vibrate(p); } catch(e){} }

/* ---------- emoji yağmuru ----------
   Not: canvas-confetti'nin shapeFromText (emoji konfeti) özelliği Safari gibi bazı
   tarayıcılarda emojiyi boş beyaz kare olarak çiziyor. Bu yüzden emojiler ayrı,
   basit DOM öğeleri olarak yağdırılıyor; her tarayıcıda aynı görünür. */
function emojiRain(ch, count){
  if(reduceMotion) return;
  const box = document.createElement("div");
  box.className = "emoji-rain"; box.setAttribute("aria-hidden", "true");
  for(let i = 0; i < count; i++){
    const s = document.createElement("span");
    s.textContent = ch;
    s.style.left = (Math.random() * 96) + "vw";
    s.style.setProperty("--s", (1.6 + Math.random() * 1.6).toFixed(2) + "rem");
    s.style.setProperty("--d", (1.8 + Math.random() * 1.4).toFixed(2) + "s");
    s.style.setProperty("--dl", (Math.random() * .8).toFixed(2) + "s");
    s.style.setProperty("--dx", ((Math.random() * 2 - 1) * 18).toFixed(1) + "vw");
    s.style.setProperty("--r", ((Math.random() * 2 - 1) * 540).toFixed(0) + "deg");
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4200);
}

/* ---------- konfeti (sadece renkli kâğıt, yıldız ve daire; emoji yok) ---------- */
function fireConfetti(kind){
  if(reduceMotion) return;
  // emoji yağmuru konfeti kütüphanesine bağlı değil: CDN yüklenmese de çalışır
  if(kind === "beer") setTimeout(() => emojiRain("🍺", 22), 250);
  else if(kind === "bill") setTimeout(() => emojiRain("💸", 14), 220);

  const c = window.confetti;
  if(typeof c !== "function") return;
  const base = { zIndex: 70, disableForReducedMotion: true };
  const colors = ["#ffd23f", "#ff2d95", "#2de2ff", "#ffffff"];
  if(kind === "beer"){
    c({ ...base, particleCount: 170, spread: 100, origin: { y: .55 }, colors });
    setTimeout(() => {
      c({ ...base, particleCount: 90, angle: 60, spread: 60, origin: { x: 0, y: .85 }, colors });
      c({ ...base, particleCount: 90, angle: 120, spread: 60, origin: { x: 1, y: .85 }, colors });
    }, 550);
  } else if(kind === "bill"){
    c({ ...base, particleCount: 110, spread: 85, origin: { y: .55 }, colors });
  } else {
    c({ ...base, particleCount: 70, spread: 75, shapes: ["star"], scalar: 1.3, origin: { y: .55 }, colors: ["#ffd23f", "#ffffff", "#ff2d95"] });
  }
}

/* =====================================================================
   SALLA – ÇEVİR (DeviceMotion)
   Android: izin istemez. iPhone (iOS 13+): bir kez dokunarak izin verilir.
   Her ikisi de HTTPS gerektirir.
   ===================================================================== */
const motion = {
  api: typeof window.DeviceMotionEvent !== "undefined",
  needsPerm: typeof window.DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function",
  listening: false, asked: false, denied: false, live: false,
  energy: 0, last: null, cooldownUntil: 0, lastQuarter: 0, events: 0, peak: 0
};
function startMotion(){
  if(motion.listening) return;
  window.addEventListener("devicemotion", onMotion, { passive: true });
  motion.listening = true;
}
function askMotion(){   // mutlaka bir dokunma/tıklama içinde çağrılmalı (iOS kuralı)
  if(!motion.needsPerm || motion.live || !isTouch){ startMotion(); return; }   // masaüstünde izin sorma
  if(motion.asked) return;
  motion.asked = true; updateHint();
  DeviceMotionEvent.requestPermission()
    .then(s => { if(s === "granted") startMotion(); else motion.denied = true; updateHint(); })
    .catch(() => { motion.denied = true; updateHint(); });
}
// Hemen dinlemeye başla: Android'de veri izin sormadan akar; iPhone'da izin verilene kadar sessiz kalır.
if(motion.api) startMotion();

function onMotion(e){
  const a = (e.acceleration && e.acceleration.x != null) ? e.acceleration : e.accelerationIncludingGravity;
  if(!a || a.x == null) return;
  motion.events++;
  if(!motion.live){ motion.live = true; updateHint(); }
  if(motion.last){
    const dx = a.x - motion.last.x, dy = a.y - motion.last.y, dz = a.z - motion.last.z;
    feedShake(Math.sqrt(dx * dx + dy * dy + dz * dz));
  }
  motion.last = { x: a.x, y: a.y, z: a.z };
}

// Ani sarsıntılar (telefonu masaya bırakmak) tetiklemesin diye enerji kademeli dolar.
// Dolu halka = spin. Yavaşlarsan halka geri boşalır.
function feedShake(jerk){
  motion.peak = Math.max(motion.peak * 0.98, jerk);
  const now = performance.now();
  const canUse = phase === "idle" && !bonusActive() && !summary.classList.contains("show") && !rules.classList.contains("show");
  if(!canUse || now < motion.cooldownUntil){ motion.energy = 0; setRing(); return; }
  const thr = 9 / CONFIG.SHAKE_SENSITIVITY;
  if(jerk > thr) motion.energy = Math.min(1, motion.energy + Math.min(0.12, (jerk - thr) * 0.012 * CONFIG.SHAKE_SENSITIVITY));
  const q = Math.floor(motion.energy * 4);
  if(q > motion.lastQuarter && q < 4){ ratchet(q); haptic(8); }
  motion.lastQuarter = q;
  setRing(); kickDecay();
  if(motion.energy >= 1){
    motion.energy = 0; motion.lastQuarter = 0; motion.cooldownUntil = now + 1200; setRing();
    cabinet.classList.remove("kick"); void cabinet.offsetWidth; cabinet.classList.add("kick");
    if(!bypass() && spinsLeft <= 0){ nudge(); return; }
    requestSpin("shake");
  }
}
function setRing(){ if(!spinBtn.classList.contains("bonus")) spinBtn.style.setProperty("--energy", motion.energy.toFixed(3)); }
let decayRaf = 0, decayLast = 0;
function kickDecay(){ if(!decayRaf){ decayLast = performance.now(); decayRaf = requestAnimationFrame(decayStep); } }
function decayStep(now){
  const dt = Math.min(0.1, (now - decayLast) / 1000); decayLast = now;
  motion.energy = Math.max(0, motion.energy - 0.9 * dt);
  if(motion.energy < 0.25) motion.lastQuarter = 0;
  setRing();
  decayRaf = motion.energy > 0 ? requestAnimationFrame(decayStep) : 0;
}
function simulateShake(){
  let k = 0; const id = setInterval(() => { feedShake(26 + Math.random() * 10); if(++k > 16) clearInterval(id); }, 16);
}
setInterval(() => {
  if(devPanel.hidden) return;
  devMotion.textContent = `Hareket sensörü: ${motion.live ? "aktif" : (motion.needsPerm ? (motion.asked ? (motion.denied ? "izin yok" : "izin bekleniyor") : "izin gerekli (iPhone)") : "veri yok (masaüstü olabilir)")} · olay: ${motion.events} · tepe sarsıntı: ${motion.peak.toFixed(1)} · enerji: ${(motion.energy * 100).toFixed(0)}%`;
}, 250);

/* =====================================================================
   MAKARA MOTORU
   Her makaranın duruş anı önceden hesaplanır: soldan sağa sırayla durur,
   duruşta hız sürekli kalır (sıçrama yok), sonda küçük bir geri sekme olur.
   ===================================================================== */
function easeOutBack(p){ const u = p - 1; return 1 + (BACK + 1) * u * u * u + BACK * u * u; }

function makePlan(outcome, turbo){
  const slowLast = outcome === "beer" || outcome === "bill" || outcome === "near-miss";
  const b = turbo ? { first: 700, gap: 230, land: 760 } : { first: 1050, gap: 330, land: 980 };
  const landMs = [], baseEnd = [];
  for(let i = 0; i < REELS; i++){ landMs.push(b.land); baseEnd.push(b.first + i * b.gap + Math.random() * 80); }
  if(slowLast){
    landMs[REELS - 1] = 2700 + Math.random() * 500;
    baseEnd[REELS - 1] = baseEnd[REELS - 2] + 2300 + Math.random() * 450;
  }
  return { landMs, baseEnd, minGap: b.gap * .75 };
}

function runReels(plan, onReelsSettled){
  return new Promise(resolve => {
    const t0 = performance.now();
    let prevEnd = 0;
    reels.forEach((r, i) => {
      const landMs = plan.landMs[i];
      const D = SPEED * landMs / 1000 / (3 + BACK);     // yavaşlama sırasında kat edilecek hücre
      const want = Math.max(plan.baseEnd[i], prevEnd + plan.minGap);
      let ts = (want - landMs) / 1000;
      ts += (mod(r.target - r.pos - SPEED * ts - D + r.n / 2, r.n) - r.n / 2) / SPEED;
      while(ts < 0 || ts * 1000 + landMs < prevEnd + plan.minGap * .6) ts += r.n / SPEED;
      Object.assign(r, { spinning: true, pos0: r.pos, D, landMs, landStart: ts * 1000, cruise: SPEED * ts });
      prevEnd = ts * 1000 + landMs;
      r.el.classList.add("is-spinning");
      r.el.classList.remove("landed", "anticipate");
    });

    let stopped = 0, tensionReel = null, tensionSym = null, lastTick = 0;
    const schedule = fn => document.hidden ? setTimeout(() => fn(performance.now()), 50) : requestAnimationFrame(fn);

    function frame(now){
      const t = now - t0;
      let allDone = true;
      reels.forEach((r, i) => {
        if(!r.spinning) return;
        allDone = false;
        const prev = r.pos;
        if(t < r.landStart){
          r.pos = r.pos0 + SPEED * t / 1000;
          r.st.style.setProperty("--mb", MB + "px");
        } else {
          const p = Math.min(1, (t - r.landStart) / r.landMs);
          r.pos = r.pos0 + r.cruise + r.D * easeOutBack(p);
          r.st.style.setProperty("--mb", (MB * (1 - p) * (1 - p)).toFixed(2) + "px");
          if(r === tensionReel && Math.floor(r.pos) !== Math.floor(prev) && now - lastTick > 55){
            lastTick = now; sfx("tick", { jitter: .06 }); haptic(4);
          }
          if(p >= 1){
            r.pos = r.target; r.spinning = false;
            r.el.classList.remove("is-spinning", "anticipate");
            r.st.style.setProperty("--mb", "0px");
            r.el.classList.remove("landed"); void r.el.offsetWidth; r.el.classList.add("landed");
            stopped++;
            sfx("reelStop", { rate: .92 + stopped * .05 }); haptic(10);
            setLoopLevel("reelLoop", Math.max(.2, 1 - stopped * .22), .15);
            if(stopped === REELS - 1){
              const lastReel = reels.find(x => x.spinning);
              const settled = []; reels.forEach((x, k) => { if(!x.spinning) settled.push({ i: k, idx: idxOf(x) }); });
              const info = tensionInfo(settled);
              const remaining = lastReel ? lastReel.landStart + lastReel.landMs - t : 0;
              if(info && lastReel && remaining > 700){
                tensionReel = lastReel; tensionSym = info.sym;
                setMode("tense"); lastReel.el.classList.add("anticipate");
                showTease(info, reels.indexOf(lastReel));   // ihtimali çerçevele
                startLoop("tension", { fade: .3 }); setLoopLevel("reelLoop", .2, .3); haptic([15, 60, 15]);
                announce(`Son makarada bir ${PRIZES[info.sym].noun} daha gelirse kazanırsın!`);
                if(onReelsSettled) onReelsSettled(info.sym);
              }
            }
          }
        }
        paint(r);
      });
      if(allDone){ resolve({ tensionSym }); return; }
      schedule(frame);
    }
    schedule(frame);
  });
}

/* ---------- sonuç belirleme ---------- */
function takeForced(){
  if(forceQueue.length) return forceQueue.shift();
  const v = devForceResult.value;
  if(v === "auto") return null;
  if(!devSticky.checked) devForceResult.value = "auto";
  return v;
}
function rollOutcome(){
  const forced = takeForced();
  if(forced) return forced;
  const r = Math.random();
  let acc = 0;
  for(const sym of PRIZE_SYMBOLS){ acc += 1 / CONFIG.ODDS[sym]; if(r < acc) return sym; }
  return Math.random() < CONFIG.NEAR_MISS_RATE ? "near-miss" : "lose";
}

/* =====================================================================
   OYUN AKIŞI
   ===================================================================== */
async function requestSpin(source, { free = false } = {}){
  if(phase !== "idle" || bonusActive()) return;
  if(summary.classList.contains("show") || rules.classList.contains("show")) return;
  if(!free && !bypass() && spinsLeft <= 0){ nudge(); return; }
  unlockAudio();
  if(!free && !bypass()) useSpin();
  phase = "busy"; updateUI();
  try {
    await doSpin(false);
    await continueRound();
  } catch(err){
    console.error(err);
  } finally {
    phase = "idle"; updateUI();
  }
}

async function doSpin(isFree){
  clearWinVisuals(); setMode("spin");
  stopActiveSfx(); stopLoop("tension", .05);

  const outcome = rollOutcome();
  const forcedLine = devForceLine.value;
  let targets;
  if(PRIZE_SYMBOLS.includes(outcome)) targets = buildWinTargets(outcome, forcedLine).idxs;
  else if(outcome === "near-miss") targets = buildNearMissTargets(REELS - 1, pick(TENSION_SYMBOLS), forcedLine).idxs;
  else targets = buildLoseTargets();
  reels.forEach((r, i) => { r.target = targets[i]; });

  sfx("spinStart"); haptic(18);
  stopLoop("reelLoop", .05); startLoop("reelLoop", { fade: .15 });
  const { tensionSym } = await runReels(makePlan(outcome, isFree && CONFIG.TURBO_IN_BONUS));
  stopLoop("reelLoop", .25); stopLoop("tension", .15);

  // kazanç her zaman EKRANDA görünen ızgaradan okunur
  const wins = winningLines(reels.map(idxOf)).filter(w => PRIZE_SYMBOLS.includes(w.symbol));
  if(!wins.length){
    if(tensionSym){
      const almostRow = markMissed();   // hedef kırmızı, simgenin durduğu yer işaretli kalır
      setMode("near"); sfx("nearMiss", { delay: .05, jitter: .02 }); haptic([20, 40, 20]);
      callout("KIL PAYI!", "var(--hot)", calloutSpot(almostRow));
      announce(`Kıl payı! Bir çizgide 3 ${PRIZES[tensionSym].noun}, dördüncüsü bir satır kaydı.`);
      await wait(1600);
    } else {
      sfx("lose", { delay: .05, jitter: .02 });
      await wait(isFree ? 380 : 120);
    }
    setMode(bonusActive() ? "spin" : "idle");
    return;
  }

  clearTease();   // kazandıysa ihtimal çerçeveleri yerini kazanç çizgisine bırakır
  const sym = PRIZE_SYMBOLS.find(s => wins.some(w => w.symbol === s));
  const lines = wins.filter(w => w.symbol === sym).map(w => w.line);
  setMode("win"); markWinCells(lines); currentWin = lines; drawWinLines();
  haptic([30, 50, 30, 50, 140]);
  await wait(700);

  if(sym === "free-spin"){
    const retrigger = bonusActive();
    const n = CONFIG.FREE_SPINS_PER_TRIGGER;
    round.freeLeft += n; round.freeTotal += n; saveRound();
    sfx("winFreeSpin", { jitter: 0 }); fanfare(); fireConfetti("free-spin");
    announce(`${n} free spin kazandın, otomatik başlıyor.`);
    await showBigWin({ icon: "free-spin", title: retrigger ? `+${n} FREE SPIN!` : `${n} FREE SPIN!`, sub: retrigger ? "Bonus uzadı" : "Otomatik başlıyor" });
  } else {
    round.stash.push({ sym, t: Date.now() }); saveRound();
    const mega = sym === "beer";
    if(mega){ sfx("winBeer", { jitter: 0 }); sfx("confetti", { delay: .2, jitter: 0 }); quake(); }
    else sfx("winDiscount", { jitter: 0 });
    fireConfetti(sym);
    announce(`${PRIZES[sym].item} kazandın!`);
    await showBigWin({ icon: sym, title: PRIZES[sym].title, sub: `${lines[0].where} 4 ${PRIZES[sym].noun}`, mega });
    if(bonusActive()) await flyToStash(sym, lines[0]);
  }
  setMode(bonusActive() ? "spin" : "idle");
}

async function continueRound(){
  while(round.freeLeft > 0){
    if(round.freeDone >= CONFIG.MAX_FREE_SPINS_PER_ROUND){ round.freeLeft = 0; break; }
    if(!inBonus) await enterBonus();
    await wait(550);
    round.freeLeft--; round.freeDone++; saveRound(); updateBonusHud();
    await doSpin(true);
  }
  if(inBonus && !round.stash.length){ setMode("idle"); callout("BONUS BİTTİ", "var(--cyan)"); await wait(1400); }
  if(round.stash.length) await showSummary();
  if(inBonus) exitBonus();
  resetRound();
}

async function enterBonus(){
  inBonus = true;
  document.body.classList.add("is-bonus");
  hud.hidden = true; bonusHud.hidden = false;
  renderStash(); updateBonusHud(); setMode("spin");
  setLoopLevel("ambient", 2.5, 1);
  await wait(350);
}
function exitBonus(){
  inBonus = false;
  document.body.classList.remove("is-bonus");
  hud.hidden = false; bonusHud.hidden = true;
  setLoopLevel("ambient", 1, 1);
  setMode("idle"); updateUI();
}

function nudge(){
  spinBtn.classList.remove("nudge"); void spinBtn.offsetWidth; spinBtn.classList.add("nudge");
  haptic([10, 40, 10]);
}
function quake(){
  if(reduceMotion) return;
  page.classList.remove("quake"); void page.offsetWidth; page.classList.add("quake");
}

/* ---------- büyük kazanç ekranı ---------- */
function showBigWin({ icon, title, sub, mega = false }){
  return new Promise(resolve => {
    bwIcon.src = ICON(icon); bwIcon.alt = LABEL[icon] || "";
    bwTitle.textContent = title; bwSub.textContent = sub;
    bigwin.classList.toggle("mega", mega);
    bigwin.setAttribute("aria-hidden", "false");
    bigwin.classList.add("show");
    let done = false;
    const finish = () => {
      if(done) return; done = true;
      bigwin.classList.remove("show"); bigwin.setAttribute("aria-hidden", "true");
      bigwin.removeEventListener("click", finish);
      setTimeout(resolve, 260);
    };
    setTimeout(() => bigwin.addEventListener("click", finish), 600);   // yanlışlıkla hemen kapanmasın
    setTimeout(finish, mega ? 3000 : 2200);
  });
}

/* ---------- ödül ikonu bonus kasasına uçar ---------- */
function flyToStash(sym, line){
  return new Promise(resolve => {
    const done = () => { renderStash(sym); chime(); haptic(12); resolve(); };
    const target = stashEl.querySelector(`[data-sym="${sym}"]`) || stashEl;
    if(reduceMotion || !CELL || !target.animate){ done(); return; }
    const rr = reelsEl.getBoundingClientRect(), c = cellCenter(0, line.rows[0]);
    const sx = rr.left + c.x, sy = rr.top + c.y;
    const tr = target.getBoundingClientRect(), tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
    const size = CELL * .85;
    const img = new Image(); img.src = ICON(sym); img.className = "flyer"; img.alt = "";
    Object.assign(img.style, { width: size + "px", height: size + "px", left: (sx - size / 2) + "px", top: (sy - size / 2) + "px" });
    document.body.appendChild(img);
    const anim = img.animate([
      { transform: "translate(0,0) scale(1)" },
      { transform: `translate(${(tx - sx) * .45}px,${(ty - sy) * .45 - 50}px) scale(1.5)`, offset: .45 },
      { transform: `translate(${tx - sx}px,${ty - sy}px) scale(.3)`, opacity: .85 }
    ], { duration: 780, easing: "cubic-bezier(.5,0,.5,1)" });
    anim.onfinish = () => { img.remove(); done(); };
  });
}

/* ---------- kazanç özeti ---------- */
let lastFocus = null;
function openSheet(el, focusEl){
  lastFocus = document.activeElement;
  el.classList.add("show"); el.setAttribute("aria-hidden", "false");
  updateUI();
  setTimeout(() => focusEl && focusEl.focus(), 60);
}
function closeSheet(el){
  el.classList.remove("show"); el.setAttribute("aria-hidden", "true");
  updateUI();
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function showSummary(){
  return new Promise(resolve => {
    const counts = {};
    round.stash.forEach(x => { counts[x.sym] = (counts[x.sym] || 0) + 1; });
    const keys = PRIZE_SYMBOLS.filter(s => counts[s]);
    sumTitle.textContent = round.stash.length > 1 ? "KASA DOLDU!" : (counts.beer ? "BEDAVA BİRA!" : "KAZANDIN!");
    sumList.innerHTML = keys.map(s => `<li><img src="${ICON(s)}" alt=""><span class="sum-n">${counts[s]}×</span><span class="sum-item">${PRIZES[s].item}</span></li>`).join("");
    const last = round.stash[round.stash.length - 1];
    sumTime.textContent = new Date(last ? last.t : Date.now()).toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    sumClose.onclick = () => { sfx("uiClick"); closeSheet(summary); resolve(); };
    openSheet(summary, sumClose);
  });
}

/* ---------- ödüller / kurallar ---------- */
function buildRules(){
  const rows = [["beer", "Bedava bira"], ["bill", "%30 indirim"], ["free-spin", `${CONFIG.FREE_SPINS_PER_TRIGGER} otomatik free spin`]];
  $("payList").innerHTML = rows.map(([s, txt]) =>
    `<li><span class="pay-icons">${`<img src="${ICON(s)}" alt="">`.repeat(4)}</span><span class="pay-prize">${txt}</span></li>`).join("");
  $("linesTitle").textContent = `${PAYLINES.length} kazanç çizgisi`;
  $("lineGrid").innerHTML = PAYLINES.map(l => {
    const dots = []; for(let x = 0; x < REELS; x++) for(let y = 0; y < ROWS; y++) dots.push(`<circle cx="${5 + x * 10}" cy="${5 + y * 10}" r="1.6" fill="#ffffff40"/>`);
    const pts = l.rows.map((y, x) => `${5 + x * 10},${5 + y * 10}`).join(" ");
    return `<figure><svg viewBox="0 0 40 50" aria-hidden="true">${dots.join("")}<polyline points="${pts}" fill="none" stroke="#ffd23f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><figcaption>${l.name}</figcaption></figure>`;
  }).join("");
  $("rulesText").textContent = `Bir çizgide soldan sağa 4 aynı simge kazandırır. ${CONFIG.SPIN_LIMIT} hakkın var; ${CONFIG.REFILL_TIMER_STARTS === "empty" ? "hakların bitince" : "ilk çevirmenden"} ${CONFIG.REFILL_MINUTES} dakika sonra hepsi yenilenir. Free spinler hakkından düşmez ve kendiliğinden döner, bu sırada kazandıkların kasada birikir. Telefonunu sallayarak da çevirebilirsin.`;
}
$("infoBtn").addEventListener("click", () => { sfx("uiClick"); buildRules(); openSheet(rules, $("rulesClose")); });
$("rulesClose").addEventListener("click", () => { sfx("uiClick"); closeSheet(rules); });
rules.addEventListener("click", e => { if(e.target === rules) closeSheet(rules); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && rules.classList.contains("show")) closeSheet(rules); });

/* ---------- girişler: buton, boşluk tuşu, sallama ---------- */
spinBtn.addEventListener("click", () => {
  askMotion();              // iPhone: ilk dokunuşta sallama izni de istenir
  requestSpin("tap");
});
motionChip.addEventListener("click", () => { askMotion(); sfx("uiClick"); });
document.addEventListener("keydown", e => {
  if(e.key !== " " && e.key !== "Enter") return;
  const t = e.target;
  if(t === spinBtn) return;
  if(t.closest && t.closest("input,select,textarea,button,a,.dev-panel,.sheet")) return;
  e.preventDefault();
  requestSpin("key");
});

/* =====================================================================
   GELİŞTİRİCİ PANELİ
   ===================================================================== */
PAYLINES.forEach(l => { const o = document.createElement("option"); o.value = l.id; o.textContent = `${l.name} (${l.rows.join("-")})`; devForceLine.appendChild(o); });
const oddInputs = { oddBeer: "beer", oddBill: "bill", oddFree: "free-spin" };
Object.entries(oddInputs).forEach(([id, sym]) => {
  const el = $(id); el.value = CONFIG.ODDS[sym];
  el.addEventListener("change", () => { const v = Math.max(1, parseInt(el.value, 10) || CONFIG.ODDS[sym]); CONFIG.ODDS[sym] = v; el.value = v; });
});
$("freeCount").value = CONFIG.FREE_SPINS_PER_TRIGGER;
$("freeCount").addEventListener("change", e => { CONFIG.FREE_SPINS_PER_TRIGGER = Math.min(10, Math.max(1, parseInt(e.target.value, 10) || 3)); e.target.value = CONFIG.FREE_SPINS_PER_TRIGGER; });
$("shakeSens").value = CONFIG.SHAKE_SENSITIVITY; $("shakeSensOut").textContent = CONFIG.SHAKE_SENSITIVITY.toFixed(1);
$("shakeSens").addEventListener("input", e => { CONFIG.SHAKE_SENSITIVITY = parseFloat(e.target.value); $("shakeSensOut").textContent = CONFIG.SHAKE_SENSITIVITY.toFixed(1); });

function openDev(){ devPanel.hidden = false; devPanel.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); }
$("devToggleBtn").addEventListener("click", () => {
  if(!devPanel.hidden){ devPanel.hidden = true; return; }
  const psw = prompt("Geliştirici şifresi:");
  if(psw === PASSWORD) openDev(); else if(psw !== null) alert("Hatalı şifre!");
});
devBypassLimit.addEventListener("change", updateUI);
$("devShake").addEventListener("click", simulateShake);
$("devBonusDemo").addEventListener("click", () => {
  if(phase !== "idle") return;
  forceQueue.length = 0;
  forceQueue.push("free-spin", "bill", "near-miss", "beer");
  devStatus.textContent = "Bonus demosu: free spin → indirim → kıl payı → bira (hak düşmez)";
  window.scrollTo({ top: 0, behavior: "smooth" });
  requestSpin("dev", { free: true });
});
$("devResetSpinsBtn").addEventListener("click", () => { refillSpins(); tickTimer(); devStatus.textContent = `Haklar ${CONFIG.SPIN_LIMIT} olarak yenilendi, sayaç durdu.`; });
$("devExpireBtn").addEventListener("click", () => {
  if(cycleStart === null){ devStatus.textContent = "Sayaç çalışmıyor: henüz bu dönemde çevirme yapılmadı."; return; }
  cycleStart = Date.now() - refillMs() + 3000; saveSpins(); tickTimer();
  devStatus.textContent = "Süre 3 saniye içinde dolacak, haklar yenilenecek.";
});
$("devClearStorageBtn").addEventListener("click", () => { store.clear(); resetRound(); initSpins(); devStatus.textContent = "Hafıza temizlendi."; });

function buildSoundTest(){
  const el = $("soundTest"); el.innerHTML = "";
  Object.entries(SOUNDS).forEach(([key, def]) => {
    const ok = !!buffers[key];
    const b = document.createElement("button"); b.type = "button";
    b.textContent = (ok ? "✔ " : "✖ ") + key + (def.loop ? " ⟳" : "");
    b.className = ok ? "" : "missing"; b.disabled = !ok;
    b.addEventListener("click", () => {
      unlockAudio();
      if(def.loop){ if(loops[key]){ stopLoop(key); b.classList.remove("on"); } else { startLoop(key); b.classList.add("on"); } }
      else sfx(key);
    });
    el.appendChild(b);
  });
}

/* ---------- test için dışarı açılan küçük kanca ---------- */
window.__lucky = { CONFIG, forceQueue, requestSpin, simulateShake, get phase(){ return phase; }, get round(){ return round; }, get spinsLeft(){ return spinsLeft; }, openDev };

/* =====================================================================
   BAŞLANGIÇ
   ===================================================================== */
initSpins();
tickTimer(); setInterval(tickTimer, 1000);
measure(); buildBulbs(); renderStash();

// Yarıda kalmış bir bonus ya da alınmamış kazanç varsa kaldığı yerden devam et
if(round.freeLeft > 0 || round.stash.length){
  phase = "busy"; updateUI();
  setTimeout(async () => {
    try { await continueRound(); } catch(e){ console.error(e); }
    finally { phase = "idle"; updateUI(); }
  }, 900);
}
})();
</script>
</body>
</html>
