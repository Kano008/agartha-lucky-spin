<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14041f">
<title>Agartha | Lucky Spin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
<style>
/* =====================================================================
   AGARTHA LUCKY SPIN — Neon Casino (indexclaude.html)
   Renkler: kadife mor zemin, neon pembe / camgöbeği / altın ışıklar
   ===================================================================== */
:root{
  --velvet:#14041f;
  --plum:#3a0f5e;
  --magenta:#ff2d95;
  --cyan:#2de2ff;
  --gold:#ffd23f;
  --hot:#ff3b3b;
  --cream:#fff4e0;
  --muted:#c9b0e6;
  --bulb-off:#3b1d52;
  --display:"Bungee","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --pop:cubic-bezier(.34,1.56,.64,1);
  /* makara alanının genişliği: ekrana sığacak kadar büyük, 4x5 hücreler kareye yakın */
  --reels-w:max(13rem, min(calc(100vw - 5.25rem), 26rem, calc((100vh - 19.5rem) * .8)));
}
@supports (height:100svh){
  :root{--reels-w:max(13rem, min(calc(100vw - 5.25rem), 26rem, calc((100svh - 19.5rem) * .8)))}
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100svh;overflow-x:hidden;
  color:var(--cream);font-family:var(--body);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(110% 55% at 50% -8%, #6b1585 0%, #6b158500 62%),
    radial-gradient(80% 50% at 50% 108%, #4a1080 0%, #4a108000 60%),
    var(--velvet);
  transition:background-color .8s;
}
/* casino halısı dokusu */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:repeating-conic-gradient(from 45deg,#ffffff08 0 25%,#0000 0 50%) 0 0/26px 26px}
/* bonus modunda arkada dönen ışık hüzmeleri */
body::after{content:"";position:fixed;left:50%;top:45%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  pointer-events:none;z-index:0;opacity:0;transition:opacity .8s;
  background:repeating-conic-gradient(#ff2d9530 0 7deg,#0000 7deg 14deg);
  animation:rot 40s linear infinite}
body.is-bonus{background-color:#2c0540}
body.is-bonus::after{opacity:1}
@keyframes rot{to{transform:rotate(1turn)}}

:where(button,a,input,select,[tabindex]):focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.page{position:relative;z-index:1;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;gap:.7rem;
  padding:max(.6rem,env(safe-area-inset-top)) 1rem max(.9rem,env(safe-area-inset-bottom))}
.page.quake{animation:quake .6s linear}
@keyframes quake{
  10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(4px,-2px)}
  30%,50%,70%{transform:translate(-6px,2px)} 40%,60%{transform:translate(6px,-1px)}}

/* ---------------- üst bar ---------------- */
.top{width:100%;max-width:30rem;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.4rem}
.top > .icon-btn{justify-self:start}
.top-actions{display:flex;justify-content:flex-end;gap:.4rem}
.icon-btn{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid #ffffff2e;background:#ffffff0f;color:var(--cream);
  font:700 1rem/1 var(--body);text-decoration:none;cursor:pointer;transition:border-color .2s,background .2s}
.icon-btn:hover{border-color:var(--gold);background:#ffd23f1f}
.sign{margin:0;text-align:center;font-family:var(--display);font-weight:400;white-space:nowrap;
  font-size:clamp(1rem,5.2vw,1.9rem);line-height:1;letter-spacing:.02em;color:#ffe6f3;
  text-shadow:0 0 2px #fff,0 0 8px var(--magenta),0 0 18px var(--magenta),0 0 38px #ff2d9599;
  animation:flicker 9s infinite}
@keyframes flicker{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.6}95%{opacity:1}}

/* ---------------- hak / süre göstergesi ---------------- */
.hud,.bonus-hud{width:100%;max-width:calc(var(--reels-w) + 3.4rem)}
.hud{display:flex;justify-content:space-between;gap:.5rem}
.hud-block{display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem;border-radius:999px;
  background:#0000004f;border:1px solid #ffffff1f}
.hud-label{font-size:.78rem;color:var(--muted)}
.hud-num{font-family:var(--display);font-size:1.05rem;line-height:1;color:var(--gold);
  font-variant-numeric:tabular-nums;text-shadow:0 0 10px #ffd23f80}
#timer.idle{color:var(--muted);text-shadow:none}
.pips{display:flex;gap:3px}
.pip{width:7px;height:7px;border-radius:50%;background:#ffffff1f;transition:background .3s,box-shadow .3s}
.pip.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.pip.spent{animation:pipOut .5s ease-out}
@keyframes pipOut{0%{transform:scale(1.9);background:#fff;box-shadow:0 0 10px #fff}}

.bonus-hud{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding:.35rem .45rem .35rem .9rem;border-radius:16px;
  background:linear-gradient(100deg,var(--magenta),#8a2cff);
  box-shadow:0 0 0 2px var(--gold),0 0 28px #ff2d95a0;animation:hudIn .55s var(--pop)}
@keyframes hudIn{from{transform:scale(.6);opacity:0}}
.bonus-count{display:flex;align-items:baseline;gap:.45rem;font-family:var(--display);color:#fff;white-space:nowrap;font-size:.95rem}
.bonus-count .hud-num{color:#fff;font-size:1.25rem;text-shadow:0 0 10px #fff9}
.stash{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end;align-items:center;min-height:2.3rem}
.stash-empty{font-size:.75rem;color:#ffe3f1;padding-right:.4rem}
.stash-item{display:flex;align-items:center;gap:.15rem;padding:.12rem .5rem .12rem .15rem;border-radius:999px;
  background:#2c0540d9;border:1px solid #ffd23f99;font-family:var(--display);font-size:.85rem;color:var(--gold)}
.stash-item img{width:1.9rem;height:1.9rem;object-fit:contain}
.stash-item.pop{animation:pop .55s var(--pop)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}}

/* ==================== KABİN ==================== */
.cabinet{position:relative;padding:20px;border-radius:26px;
  background:linear-gradient(160deg,#4d1574,#23073c 45%,#170429);
  box-shadow:inset 0 0 0 2px #ffd23f4d,0 0 0 1px #000,0 22px 50px #000b,0 0 60px #ff2d9530}
.cabinet.kick{animation:kick .45s ease-out}
@keyframes kick{20%{transform:rotate(-2deg) scale(1.02)}45%{transform:rotate(1.6deg)}70%{transform:rotate(-.8deg)}}

/* --- marquee ampulleri: oyunun durumuna göre yanıp söner --- */
.bulbs{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.bulb{--on:var(--gold);position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:var(--bulb-off);box-shadow:inset 0 -1px 2px #0007}
.bulb:nth-child(odd){--on2:var(--cyan)}
.bulb:nth-child(even){--on2:var(--magenta)}
@keyframes chase{0%{background:var(--on);box-shadow:0 0 7px 1px var(--on)}50%{background:var(--bulb-off);box-shadow:inset 0 -1px 2px #0007}}
@keyframes blink2{0%{background:var(--on);box-shadow:0 0 9px 2px var(--on)}50%{background:#fff;box-shadow:0 0 12px 3px #fff}}
.cabinet[data-mode="idle"] .bulb{animation:chase 1.6s steps(1,end) infinite;animation-delay:calc(var(--i) * -.2s)}
.cabinet[data-mode="spin"] .bulb{--on:var(--on2);animation:chase .42s steps(1,end) infinite;animation-delay:calc(var(--i) * -.06s)}
.cabinet[data-mode="tense"] .bulb{--on:var(--hot);animation:chase .18s steps(1,end) infinite}
.cabinet[data-mode="near"] .bulb{--on:var(--hot);animation:chase .5s steps(1,end) 2}
.cabinet[data-mode="win"] .bulb{animation:blink2 .24s steps(1,end) infinite}
.cabinet[data-mode="off"] .bulb{animation:none}
body.is-bonus .cabinet[data-mode="idle"] .bulb{--on:var(--on2)}

/* --- makara penceresi --- */
.window{position:relative;border-radius:14px;padding:6px;background:#07010d;
  box-shadow:inset 0 0 0 2px #000,inset 0 0 30px #000,0 0 0 3px var(--gold),0 0 20px #ffd23f66;
  transition:box-shadow .3s}
.cabinet[data-mode="tense"] .window{animation:tenseGlow .5s ease-in-out infinite}
@keyframes tenseGlow{50%{box-shadow:inset 0 0 0 2px #000,inset 0 0 30px #000,0 0 0 3px var(--hot),0 0 34px var(--hot)}}
body.is-bonus .window{box-shadow:inset 0 0 0 2px #000,inset 0 0 30px #000,0 0 0 3px var(--magenta),0 0 26px #ff2d95aa}

.reels{position:relative;display:flex;gap:4px;width:var(--reels-w)}
.reel{flex:1;min-width:0;position:relative;overflow:hidden;aspect-ratio:1 / 5;border-radius:8px;
  background:linear-gradient(90deg,#1b0a29,#2d1446 50%,#1b0a29);transition:box-shadow .2s}
/* silindir gölgesi */
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(#000000c0 0%,#0000 13%,#0000 87%,#000000c0 100%)}
/* durduğu an kısa beyaz parlama */
.reel::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;background:#fff;opacity:0}
.reel.landed::before{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.reel.anticipate{z-index:2;box-shadow:0 0 0 2px var(--hot),0 0 22px 4px var(--hot);animation:antic .3s steps(2,end) infinite}
@keyframes antic{50%{box-shadow:0 0 0 2px var(--gold),0 0 30px 6px var(--gold)}}

.strip{position:absolute;left:0;right:0;top:0;will-change:transform;filter:blur(var(--mb,0px))}
.cell{display:flex;align-items:center;justify-content:center;position:relative}
.cell img{width:76%;height:76%;object-fit:contain;display:block;user-select:none;pointer-events:none;
  transition:opacity .3s,filter .3s,transform .3s}
.reel.is-spinning .cell img{transition:none}
.cabinet.has-win .cell:not(.is-win) img{opacity:.25;filter:grayscale(.75) brightness(.7)}
.cell.is-win{background:radial-gradient(circle,#ffd23f45,#0000 68%)}
.cell.is-win img{animation:winpulse .8s ease-in-out infinite}
@keyframes winpulse{
  0%,100%{transform:scale(1.05);filter:drop-shadow(0 0 6px var(--gold)) brightness(1.15)}
  50%{transform:scale(1.22);filter:drop-shadow(0 0 16px var(--gold)) brightness(1.4)}}

/* kazanan çizgi (neon tüp: altta pembe kalın, üstte altın ince) */
.win-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
.win-line{fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drawline .55s var(--ease) forwards}
.win-line.under{stroke:var(--magenta);stroke-width:10;opacity:.55;filter:blur(2px)}
.win-line.over{stroke:#fff6c8;stroke-width:3.5;filter:drop-shadow(0 0 5px var(--gold))}
@keyframes drawline{to{stroke-dashoffset:0}}

/* kıl payı: eşleşen 3 hücre çerçevelenir, son makarada hedef kutusu gösterilir */
.tease-layer{position:absolute;inset:0;pointer-events:none;z-index:7}
.cell.is-tease::after,.cell.is-almost::after{content:"";position:absolute;inset:5% 7%;border-radius:12px;pointer-events:none}
.cell.is-tease::after{border:3px solid var(--gold);box-shadow:0 0 12px var(--gold),inset 0 0 10px #ffd23f55;
  animation:teasePulse .45s ease-in-out infinite alternate}
@keyframes teasePulse{to{border-color:var(--hot);box-shadow:0 0 20px var(--hot),inset 0 0 12px #ff3b3b55}}
.cell.is-almost::after{border:3px dashed var(--cyan);box-shadow:0 0 14px var(--cyan),inset 0 0 10px #2de2ff44}
.tease-target{position:absolute;border-radius:12px;border:3px dashed var(--gold);background:#ffd23f14;
  box-shadow:0 0 18px var(--gold),inset 0 0 16px #ffd23f40;animation:targetPulse .4s ease-in-out infinite alternate}
@keyframes targetPulse{to{border-color:#fff;box-shadow:0 0 30px var(--gold),inset 0 0 22px #ffd23f70}}
.tease-target img{position:absolute;right:-8px;top:-10px;width:26px;height:26px;object-fit:contain;border-radius:50%;
  background:#14041f;border:2px solid var(--gold);padding:2px}
.tease-target.missed{border-style:solid;border-color:var(--hot);background:#ff3b3b1f;box-shadow:0 0 22px var(--hot);animation:none}
.tease-target.missed img{border-color:var(--hot)}
.tease-target.missed::after{content:"✕";position:absolute;left:-8px;top:-10px;width:22px;height:22px;display:grid;place-items:center;
  border-radius:50%;background:var(--hot);color:#fff;font:700 .75rem/1 var(--body)}
.tease-line{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 9;
  opacity:.9;filter:drop-shadow(0 0 4px var(--hot));animation:dashMove .5s linear infinite}
.tease-line.missed{stroke:var(--hot);animation:none;opacity:.75}
@keyframes dashMove{to{stroke-dashoffset:-11}}
/* odak: ihtimal varken diğer hücreler geri çekilir (dönen son makara hariç) */
.cabinet.has-tease .reel:not(.anticipate) .cell:not(.is-tease):not(.is-almost) img{opacity:.32;filter:grayscale(.6) brightness(.7)}

/* pencere içi büyük uyarı yazısı (KIL PAYI! vb.) */
.callout{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:8}
.callout.at-top{align-items:start;padding-top:3%}
.callout.at-bottom{align-items:end;padding-bottom:3%}
.callout span{font-family:var(--display);font-size:clamp(1.8rem,9vw,2.9rem);line-height:1;white-space:nowrap;
  color:#fff;padding:.25em .55em;border-radius:14px;background:#0a0012d9;
  border:2px solid var(--c,var(--hot));box-shadow:0 0 24px var(--c,var(--hot));
  text-shadow:0 0 12px var(--c,var(--hot));opacity:0;transform:scale(.4) rotate(-6deg)}
.callout.show span{animation:calloutIn 1.25s var(--pop) forwards}
@keyframes calloutIn{
  0%{opacity:0;transform:scale(.4) rotate(-6deg)}
  25%{opacity:1;transform:scale(1.08) rotate(-4deg)}
  80%{opacity:1;transform:scale(1) rotate(-4deg)}
  100%{opacity:0;transform:scale(.95) rotate(-4deg)}}

/* ==================== ÇEVİR BUTONU + SALLAMA HALKASI ==================== */
.controls{display:flex;flex-direction:column;align-items:center;gap:.55rem;margin-top:.35rem}
.spin-btn{--energy:0;position:relative;width:5.6rem;height:5.6rem;border-radius:50%;border:0;padding:0;
  background:none;cursor:pointer;touch-action:manipulation}
.spin-ring{position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(var(--cyan) calc(var(--energy) * 1turn),#ffffff1c 0);
  -webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 5px),#000 calc(100% - 4px));
          mask:radial-gradient(farthest-side,#0000 calc(100% - 5px),#000 calc(100% - 4px));
  filter:drop-shadow(0 0 6px var(--cyan))}
.spin-face{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  background:radial-gradient(circle at 50% 28%,#ff8ac8,var(--magenta) 45%,#a3005a);
  box-shadow:0 6px 0 #6a0040,0 12px 26px #000b,0 0 34px #ff2d958c,inset 0 4px 10px #ffffff70;
  transition:transform .1s,box-shadow .1s,filter .3s}
.spin-label{font-family:var(--display);font-size:1.2rem;line-height:1;color:#fff;text-shadow:0 2px 0 #7a0048}
.spin-sub{font-size:.68rem;font-weight:500;color:#ffe6f3}
.spin-sub:empty{display:none}
.spin-btn:active:not(:disabled) .spin-face{transform:translateY(5px);box-shadow:0 1px 0 #6a0040,0 4px 10px #000b,0 0 20px #ff2d958c,inset 0 4px 10px #ffffff70}
.spin-btn.ready .spin-face{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 6px 0 #6a0040,0 12px 26px #000b,0 0 56px #ff2d95d0,inset 0 4px 10px #ffffff70}}
.spin-btn:disabled{cursor:default}
.spin-btn:disabled:not(.bonus):not(.out) .spin-face{filter:saturate(.55) brightness(.75)}
.spin-btn.bonus .spin-face{background:radial-gradient(circle at 50% 28%,#fff3b0,var(--gold) 45%,#c77d00);box-shadow:0 6px 0 #7a4a00,0 12px 26px #000b,0 0 40px #ffd23fa0,inset 0 4px 10px #ffffff90}
.spin-btn.bonus .spin-label{color:#5a1200;text-shadow:none}
.spin-btn.bonus .spin-sub{color:#5a1200}
.spin-btn.bonus .spin-ring{background:conic-gradient(var(--gold) calc(var(--energy) * 1turn),#ffffff1c 0);filter:drop-shadow(0 0 6px var(--gold))}
.spin-btn.out .spin-face{background:radial-gradient(circle at 50% 28%,#6a5a80,#3b2a52 55%,#21142f);box-shadow:0 6px 0 #160c22,0 12px 26px #000b,inset 0 3px 8px #ffffff30}
.spin-btn.out .spin-label{font-size:1.05rem;color:var(--gold);text-shadow:0 0 8px #ffd23f80}
.spin-btn.nudge{animation:nudge .4s}
@keyframes nudge{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.hint{margin:0;font-size:.85rem;color:var(--muted);text-align:center;min-height:1.2em}
.hint.live::before{content:"📳";display:inline-block;margin-right:.35rem;animation:wobble 1.6s ease-in-out infinite}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-16deg)}20%,40%{transform:rotate(16deg)}}
.motion-chip{border:1.5px solid var(--cyan);background:#2de2ff1a;color:var(--cyan);border-radius:999px;
  padding:.5rem 1rem;font:500 .85rem var(--body);cursor:pointer;box-shadow:0 0 14px #2de2ff55}

/* ==================== BÜYÜK KAZANÇ EKRANI ==================== */
.bigwin{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle,#3a0f5ee0,#0a0012f5 70%);opacity:0;pointer-events:none;transition:opacity .25s}
.bigwin.show{opacity:1;pointer-events:auto}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;
  background:repeating-conic-gradient(#ffd23f33 0 9deg,#0000 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0 12%,#0000 58%);mask:radial-gradient(circle,#000 0 12%,#0000 58%);
  animation:rot 12s linear infinite}
.bigwin.mega .rays{background:repeating-conic-gradient(#ffd23f55 0 7deg,#ff2d9533 7deg 14deg,#0000 14deg 21deg);animation-duration:6s}
.bw-card{position:relative;text-align:center;padding:1rem;transform:scale(.25);transition:transform .6s var(--pop)}
.bigwin.show .bw-card{transform:scale(1)}
.bw-icon{width:min(44vw,11rem);height:min(44vw,11rem);object-fit:contain;filter:drop-shadow(0 0 30px var(--gold));animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}
.bw-title{font-family:var(--display);font-size:clamp(2.3rem,12vw,4.4rem);line-height:.95;margin:.6rem 0 .5rem;
  color:var(--gold);transform:rotate(-4deg);
  text-shadow:0 3px 0 var(--magenta),0 6px 0 #7a2cff,0 0 34px #ffd23fa0}
.bigwin.mega .bw-title{animation:titleFlash .3s steps(2,end) 8}
@keyframes titleFlash{50%{color:#fff}}
.bw-sub{font-size:1rem;color:var(--cream)}

/* ==================== MODAL (özet / kurallar) ==================== */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem;
  background:#0a0012e0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.show{opacity:1;pointer-events:auto}
.sheet-card{position:relative;width:min(100%,24rem);max-height:calc(100svh - 2rem);overflow:auto;
  border-radius:22px;padding:1.6rem 1.3rem 1.3rem;text-align:center;
  background:linear-gradient(170deg,#45136e,#1c0630);
  box-shadow:0 0 0 2px var(--gold),0 0 44px #ffd23f55,0 30px 60px #000;
  transform:translateY(24px) scale(.92);transition:transform .5s var(--pop)}
.sheet.show .sheet-card{transform:none}
.sheet-title{font-family:var(--display);font-weight:400;margin:0 0 1rem;font-size:2.1rem;line-height:1;color:var(--gold);
  text-shadow:0 3px 0 var(--magenta),0 0 24px #ffd23f88}
.sheet-title.small{font-size:1.6rem}
.sum-list{list-style:none;margin:0 0 1.1rem;padding:0;display:flex;flex-direction:column;gap:.5rem}
.sum-list li{display:flex;align-items:center;gap:.7rem;padding:.45rem .8rem .45rem .45rem;border-radius:14px;background:#0000004d;border:1px solid #ffd23f55;text-align:left}
.sum-list img{width:3.2rem;height:3.2rem;object-fit:contain;filter:drop-shadow(0 0 10px #ffd23f88)}
.sum-n{font-family:var(--display);font-size:1.5rem;color:var(--gold);min-width:2.4rem}
.sum-item{font-size:1.1rem;font-weight:700}
.sum-note{margin:0 0 .2rem;font-size:.95rem}
.sum-time{margin:0 0 1.2rem;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cta{width:100%;border:0;border-radius:14px;padding:1rem;cursor:pointer;
  font-family:var(--display);font-size:1.15rem;color:#3a1500;
  background:linear-gradient(#fff1a8,var(--gold) 50%,#f0a800);
  box-shadow:0 5px 0 #9a6200,0 0 24px #ffd23f88;transition:transform .1s,box-shadow .1s}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #9a6200,0 0 18px #ffd23f88}
.cta.ghost{background:#ffffff14;color:var(--cream);box-shadow:inset 0 0 0 1.5px #ffffff40;font-size:1rem}

.pay-list{list-style:none;margin:0 0 1.2rem;padding:0;display:flex;flex-direction:column;gap:.45rem}
.pay-list li{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.4rem .7rem .4rem .4rem;border-radius:12px;background:#0000004d}
.pay-icons{display:flex}
.pay-icons img{width:1.85rem;height:1.85rem;object-fit:contain;margin-right:-.3rem}
.pay-prize{font-weight:700;text-align:right;font-size:.95rem}
.sheet-sub{margin:0 0 .6rem;font-size:.95rem;font-weight:500;color:var(--muted)}
.line-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr));gap:.4rem;margin-bottom:1rem}
.line-grid figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.line-grid svg{width:2.6rem;height:3.25rem;background:#0000004d;border-radius:6px}
.line-grid figcaption{font-size:.62rem;color:var(--muted);line-height:1.1}
.rules-text{margin:0 0 1.1rem;font-size:.85rem;line-height:1.5;color:var(--cream);text-align:left}

/* emoji yağmuru (bira / indirim kazanınca) */
.emoji-rain{position:fixed;inset:0;z-index:71;pointer-events:none;overflow:hidden}
.emoji-rain span{position:absolute;top:-3.5rem;font-size:var(--s);line-height:1;
  animation:emojiFall var(--d) cubic-bezier(.3,.1,.6,1) var(--dl) both;will-change:transform}
@keyframes emojiFall{
  from{transform:translate(0,0) rotate(0)}
  to{transform:translate(var(--dx),calc(100vh + 7rem)) rotate(var(--r))}}

/* uçan ödül ikonu (bonus kasasına) */
.flyer{position:fixed;z-index:45;pointer-events:none;object-fit:contain;filter:drop-shadow(0 0 14px var(--gold))}

/* ==================== GELİŞTİRİCİ PANELİ ==================== */
.foot{margin-top:auto;padding-top:1rem}
.dev-link{background:none;border:0;color:#ffffff40;font:.72rem var(--body);cursor:pointer}
.dev-link:hover{color:var(--muted)}
.dev-panel{width:100%;max-width:34rem;background:#0d0216;border:1px dashed var(--magenta);border-radius:12px;
  padding:1rem;font-size:.82rem;display:flex;flex-direction:column;gap:.8rem}
.dev-panel h4{margin:0;color:var(--magenta);font-size:.95rem}
.dev-group{display:flex;flex-direction:column;gap:.35rem}
.dev-group > label{color:var(--muted)}
.dev-check{display:flex;align-items:center;gap:.45rem;color:var(--cream)}
.dev-panel select,.dev-panel button,.dev-panel input[type=number]{background:#1f0b2e;border:1px solid #4a2a63;color:var(--cream);
  padding:.45rem .6rem;border-radius:6px;font:inherit}
.dev-panel button{cursor:pointer}
.dev-panel button:hover{border-color:var(--gold);color:var(--gold)}
.dev-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.dev-grid label{display:flex;align-items:center;gap:.35rem;color:var(--muted)}
.dev-grid input{width:5rem}
.dev-row{display:flex;flex-wrap:wrap;gap:.45rem}
.dev-motion,.dev-status{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}
.sound-test{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.35rem}
.sound-test button{text-align:left}
.sound-test button.missing{opacity:.4;cursor:not-allowed}
.sound-test button.on{border-color:var(--gold);color:var(--gold)}

/* dar telefonlar */
@media (max-width:400px){
  .pip{width:5px;height:5px}
  .pips{gap:2px}
  .hud-block{padding:.3rem .6rem;gap:.35rem}
  .hud-label{font-size:.7rem}
  .icon-btn{width:2.25rem;height:2.25rem;font-size:.9rem}
}
@media (max-width:350px){
  .pips{display:none}
}

@media (prefers-reduced-motion:reduce){
  .bulb{animation:none !important;background:var(--on) !important}
  .cabinet[data-mode="off"] .bulb{background:var(--bulb-off) !important}
  body::after,.rays,.sign,.bw-icon,.hint.live::before,.spin-btn.ready .spin-face{animation:none !important}
  .page.quake,.cabinet.kick{animation:none}
  .cell.is-win img{animation:none;transform:scale(1.12)}
  .cell.is-tease::after,.tease-target,.tease-line{animation:none}
}

<script>
(function(){
"use strict";

/* =====================================================================
   AYARLAR — oranlar ve davranış buradan değiştirilir
   ===================================================================== */
const CONFIG = {
  SPIN_LIMIT: 10,                 // bir dönemde kaç çevirme hakkı var
  REFILL_MINUTES: 60,             // sayaç başladıktan kaç dakika sonra haklar yenilensin
  REFILL_TIMER_STARTS: "first-spin", // "first-spin" = ilk çevirmede başlar · "empty" = haklar bitince başlar
  // Her spin için kazanma ihtimali: 1/N
  ODDS: { beer: 600, bill: 300, "free-spin": 20 },   // free spin: eskiden 1/200, şimdi 1/20
  FREE_SPINS_PER_TRIGGER: 3,      // 4 free spin simgesi = kaç OTOMATİK çevirme (1 yaparsan eski "+1 hak" gibi olur)
  MAX_FREE_SPINS_PER_ROUND: 30,   // sonsuz zincire karşı güvenlik sınırı
  NEAR_MISS_RATE: 0.08,           // kaybeden spinlerin ne kadarı "kıl payı" görünsün
  SHAKE_SENSITIVITY: 1,           // 0.5 = sert sallamak gerekir · 2 = hafif sallama yeter
  TURBO_IN_BONUS: true            // free spinlerde makaralar daha çabuk durur
};

const REELS = 4, ROWS = 5, MID = 2;   // 4 makara x 5 satır, makaranın "merkez" satırı = 2
const SPEED = 44;                     // dönüş hızı (hücre/saniye)
const BACK = 0.8;                     // duruşta küçük geri sekme miktarı
const MB = 1.6;                       // dönüşte hareket bulanıklığı (px)
const PASSWORD = "aek06agartha";

/* ---------- SİMGELER (index4 ile aynı şeritler) ---------- */
const STRIPS = [
 "logo.bill.free-spin.vodka-energy.vodka-energy.free-spin.gin-tonic.gin-tonic.free-spin.cocktail.cocktail.free-spin.cocktail.pizza.free-spin.pizza.pizza.shot.free-spin.shot.shot.free-spin.shot.beer.free-spin.beer.beer.free-spin.beer.beer.free-spin.beer".split("."),
 "logo.bill.free-spin.bill.vodka-energy.free-spin.vodka-energy.gin-tonic.free-spin.gin-tonic.cocktail.free-spin.cocktail.cocktail.free-spin.pizza.pizza.pizza.free-spin.shot.shot.free-spin.shot.shot.free-spin.beer.beer.free-spin.beer.beer.free-spin.beer".split("."),
 "logo.bill.free-spin.vodka-energy.vodka-energy.free-spin.gin-tonic.gin-tonic.free-spin.cocktail.cocktail.free-spin.cocktail.pizza.free-spin.pizza.pizza.pizza.free-spin.shot.shot.free-spin.shot.shot.free-spin.beer.beer.free-spin.beer.beer.free-spin.beer".split("."),
 "logo.bill.free-spin.bill.vodka-energy.free-spin.vodka-energy.gin-tonic.free-spin.gin-tonic.cocktail.free-spin.cocktail.cocktail.free-spin.pizza.pizza.pizza.free-spin.shot.shot.free-spin.shot.shot.free-spin.beer.beer.free-spin.beer.beer.free-spin.beer".split(".")
];
const ICON = id => `./drinks/${id}.png`;
const LABEL = {logo:"Agartha",bill:"Hesap",beer:"Bira",shot:"Shot",cocktail:"Kokteyl",
  pizza:"Pizza","vodka-energy":"Vodka & Energy","gin-tonic":"Gin & Tonic","free-spin":"Free Spin"};

// değer sırası: aynı anda birden fazla ödül görünürse en değerlisi sayılır
const PRIZE_SYMBOLS = ["beer", "bill", "free-spin"];
// gerilim (son makara yavaşlar, ampuller kırmızı yanar) sadece değerli ödüllerde
const TENSION_SYMBOLS = ["beer", "bill"];
const PRIZES = {
  beer:        { title:"BEDAVA BİRA!", item:"Bedava bira", noun:"bira" },
  bill:        { title:"%30 İNDİRİM!", item:"%30 indirim", noun:"hesap" },
  "free-spin": { title:"FREE SPIN!",   item:"Free spin",   noun:"free spin" }
};

/* 4x5 ızgara için kazanç çizgileri (satır: 0 en üst … 4 en alt), soldan sağa 4 makara */
const PAYLINES = [
  { id:"r2", name:"Orta",      where:"Orta satırda",     rows:[2,2,2,2] },
  { id:"r1", name:"Üst",       where:"Üst satırda",      rows:[1,1,1,1] },
  { id:"r3", name:"Alt",       where:"Alt satırda",      rows:[3,3,3,3] },
  { id:"r0", name:"En üst",    where:"En üst satırda",   rows:[0,0,0,0] },
  { id:"r4", name:"En alt",    where:"En alt satırda",   rows:[4,4,4,4] },
  { id:"v",  name:"V",         where:"V çizgisinde",     rows:[1,2,2,1] },
  { id:"a",  name:"Λ",         where:"Λ çizgisinde",     rows:[3,2,2,3] },
  { id:"dd", name:"İnen",      where:"İnen çaprazda",    rows:[0,1,2,3] },
  { id:"du", name:"Çıkan",     where:"Çıkan çaprazda",   rows:[4,3,2,1] }
];

/* ---------- küçük yardımcılar ---------- */
const $ = id => document.getElementById(id);
const rand = n => Math.floor(Math.random() * n);
const pick = arr => arr[rand(arr.length)];
const mod = (a, n) => ((a % n) + n) % n;
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const isTouch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} },
  clear(){ try { localStorage.clear(); } catch(e){} }
};

/* =====================================================================
   KAZANÇ MANTIĞI (saf fonksiyonlar)
   Her makaranın "idx" değeri ORTA satırdaki (satır 2) simgenin şerit indeksi.
   ===================================================================== */
function symAt(i, idx, row){ const s = STRIPS[i]; return s[mod(idx + row - MID, s.length)]; }

function winningLines(idxs){
  return PAYLINES.map(line => {
    const syms = line.rows.map((row, i) => symAt(i, idxs[i], row));
    return syms.every(x => x === syms[0]) ? { line, symbol: syms[0] } : null;
  }).filter(Boolean);
}
function idxOptions(i, row, symbol){
  const s = STRIPS[i], out = [];
  s.forEach((sym, k) => { if(sym === symbol) out.push(mod(k - (row - MID), s.length)); });
  return out;
}
const linePool = id => (id && id !== "auto") ? PAYLINES.filter(l => l.id === id) : PAYLINES;

// KAZANÇ: seçilen çizgide 4 aynı simge; mümkünse başka hiçbir çizgi kazanmasın
function buildWinTargets(symbol, forcedLine){
  let last = null;
  for(let a = 0; a < 600; a++){
    const line = pick(linePool(forcedLine));
    const idxs = line.rows.map((row, i) => pick(idxOptions(i, row, symbol)));
    last = { idxs, line };
    const wins = winningLines(idxs);
    const strict = a < 450;
    if(wins.length && wins.every(w => w.symbol === symbol) && (!strict || wins.length === 1)) return last;
  }
  return last;
}
// KAYIP: hiçbir çizgide (hiçbir simgeyle) 4'lü yok
function buildLoseTargets(){
  for(let a = 0; a < 800; a++){
    const idxs = STRIPS.map(s => rand(s.length));
    if(winningLines(idxs).length === 0) return idxs;
  }
  return STRIPS.map(s => rand(s.length));
}
// KIL PAYI: bir çizgide ilk 3 makara aynı ödül, son makara ıskalar (tercihen simge hemen üstünde/altında)
function buildNearMissTargets(missReel, tease, forcedLine){
  for(let a = 0; a < 600; a++){
    const line = pick(linePool(forcedLine));
    const idxs = line.rows.map((row, i) => {
      if(i !== missReel) return pick(idxOptions(i, row, tease));
      const n = STRIPS[i].length, all = [], close = [];
      for(let c = 0; c < n; c++){
        if(symAt(i, c, row) === tease) continue;
        all.push(c);
        if((row > 0 && symAt(i, c, row - 1) === tease) || (row < ROWS - 1 && symAt(i, c, row + 1) === tease)) close.push(c);
      }
      return pick(close.length ? close : all);
    });
    if(winningLines(idxs).length === 0) return { idxs, line };
  }
  return { idxs: buildLoseTargets(), line: null };
}
// ilk makaralar durduğunda: bir çizgide hepsi aynı DEĞERLİ ödül mü?
// -> { sym, lines } (hangi simge, hangi çizgi(ler)de ihtimal var) ya da null
function tensionInfo(settled){
  const hits = [];
  PAYLINES.forEach(line => {
    const syms = settled.map(({ i, idx }) => symAt(i, idx, line.rows[i]));
    if(syms.length && syms.every(x => x === syms[0]) && TENSION_SYMBOLS.includes(syms[0])) hits.push({ line, sym: syms[0] });
  });
  if(!hits.length) return null;
  const sym = TENSION_SYMBOLS.find(s => hits.some(h => h.sym === s));
  return { sym, lines: hits.filter(h => h.sym === sym).map(h => h.line) };
}

/* =====================================================================
   DOM
   ===================================================================== */
const page = $("page"), cabinet = $("cabinet"), bulbsEl = $("bulbs"), reelsEl = $("reels"), winLinesEl = $("winLines");
const spinBtn = $("spinBtn"), spinLabel = $("spinLabel"), spinSub = $("spinSub"), hintEl = $("hint"), motionChip = $("motionChip");
const hud = $("hud"), pipsEl = $("pips"), spinsNum = $("spinsNum"), timerEl = $("timer");
const bonusHud = $("bonusHud"), fsNow = $("fsNow"), fsTotal = $("fsTotal"), stashEl = $("stash");
const calloutEl = $("callout"), calloutText = $("calloutText");
const bigwin = $("bigwin"), bwIcon = $("bwIcon"), bwTitle = $("bwTitle"), bwSub = $("bwSub");
const summary = $("summary"), sumTitle = $("sumTitle"), sumList = $("sumList"), sumTime = $("sumTime"), sumClose = $("sumClose");
const rules = $("rules"), liveEl = $("live"), soundToggle = $("soundToggle");
const devPanel = $("devPanel"), devBypassLimit = $("devBypassLimit"), devForceResult = $("devForceResult"),
      devSticky = $("devSticky"), devForceLine = $("devForceLine"), devStatus = $("devStatus"), devMotion = $("devMotion");

/* ---------- görselleri önceden yükle ---------- */
Object.keys(LABEL).forEach(id => { const im = new Image(); im.src = ICON(id); });

/* ---------- makaraları kur (şerit 3 kez tekrarlanır) ---------- */
const initial = buildLoseTargets();
const reels = STRIPS.map((strip, i) => {
  const el = document.createElement("div"); el.className = "reel";
  const st = document.createElement("div"); st.className = "strip";
  for(let c = 0; c < 3; c++) strip.forEach(id => {
    const cell = document.createElement("div"); cell.className = "cell";
    const img = document.createElement("img");
    img.src = ICON(id); img.alt = LABEL[id]; img.draggable = false;
    cell.appendChild(img); st.appendChild(cell);
  });
  el.appendChild(st); reelsEl.appendChild(el);
  return { el, st, strip, n: strip.length, pos: initial[i], target: initial[i], spinning: false, cells: [...st.children] };
});
const idxOf = r => mod(Math.round(r.pos), r.n);

let CELL = 0;
function measure(){
  CELL = reels[0].el.clientHeight / ROWS;
  if(!CELL) return;
  reels.forEach(r => {
    r.cells.forEach(c => { c.style.height = CELL + "px"; });
    r.st.style.height = (CELL * r.n * 3) + "px";
    paint(r);
  });
  if(currentWin) drawWinLines();
  if(currentTease) drawTease();
}
function paint(r){
  const p = mod(r.pos, r.n);
  r.st.style.transform = `translate3d(0,${-((p - MID + r.n) * CELL)}px,0)`;
}
new ResizeObserver(measure).observe(reelsEl);

/* ---------- marquee ampulleri ---------- */
// Ampuller kabinin yuvarlak kenarını takip eden bir yol üzerine eşit aralıkla dizilir;
// köşelerde de kavisin üstünde kalırlar, çerçevenin dışına taşmazlar.
function buildBulbs(){
  const w = cabinet.clientWidth, h = cabinet.clientHeight;
  if(!w || !h) return;
  const inset = 10, gap = 21;
  const R = parseFloat(getComputedStyle(cabinet).borderTopLeftRadius) || 0;
  const r = Math.max(0, R - inset);                 // içteki yolun köşe yarıçapı
  const x0 = inset, y0 = inset, W = w - inset * 2, H = h - inset * 2;
  const sw = W - 2 * r, sh = H - 2 * r, arc = Math.PI * r / 2;
  const segs = [   // saat yönünde: üst kenar → sağ üst köşe → sağ kenar → …
    { len: sw,  at: t => [x0 + r + t, y0] },
    { len: arc, at: t => { const a = -Math.PI / 2 + t / r; return [x0 + W - r + r * Math.cos(a), y0 + r + r * Math.sin(a)]; } },
    { len: sh,  at: t => [x0 + W, y0 + r + t] },
    { len: arc, at: t => { const a = t / r; return [x0 + W - r + r * Math.cos(a), y0 + H - r + r * Math.sin(a)]; } },
    { len: sw,  at: t => [x0 + W - r - t, y0 + H] },
    { len: arc, at: t => { const a = Math.PI / 2 + t / r; return [x0 + r + r * Math.cos(a), y0 + H - r + r * Math.sin(a)]; } },
    { len: sh,  at: t => [x0, y0 + H - r - t] },
    { len: arc, at: t => { const a = Math.PI + t / r; return [x0 + r + r * Math.cos(a), y0 + r + r * Math.sin(a)]; } }
  ];
  const P = segs.reduce((a, s) => a + s.len, 0);
  const N = Math.max(12, Math.round(P / gap));
  const pts = [];
  for(let k = 0; k < N; k++){
    let s = (k + .5) * P / N;
    for(const g of segs){
      if(g.len > 0 && s <= g.len){ pts.push(g.at(s)); break; }
      s -= g.len;
    }
  }
  bulbsEl.innerHTML = pts.map(([x, y], i) => `<i class="bulb" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;--i:${i}"></i>`).join("");
}
new ResizeObserver(buildBulbs).observe(cabinet);
const setMode = m => { cabinet.dataset.mode = m; };

/* ---------- kazanan hücre ve çizgi görselleri ---------- */
const SVG_NS = "http://www.w3.org/2000/svg";
let currentWin = null;
function clearWinVisuals(){
  currentWin = null; winLinesEl.innerHTML = ""; cabinet.classList.remove("has-win");
  reels.forEach(r => r.cells.forEach(c => c.classList.remove("is-win")));
  clearTease();
}
// bir makaranın belirli satırındaki hücreye (şeridin 3 kopyasında da) sınıf ekle
function markCell(i, row, cls){
  const r = reels[i], m = mod(idxOf(r) + row - MID, r.n);
  r.cells.forEach((c, k) => { if(k % r.n === m) c.classList.add(cls); });
}

/* ---------- KIL PAYI GÖSTERİMİ ----------
   Son makara dönerken: eşleşen 3 hücre çerçevelenir, son makarada simgenin
   gelmesi gereken yer "hedef kutusu" ile gösterilir, aralarına kesikli çizgi çekilir.
   Iskalarsa hedef kırmızıya döner ve simgenin gerçekte durduğu hücre işaretlenir. */
const teaseLayer = document.createElement("div");
teaseLayer.className = "tease-layer"; teaseLayer.setAttribute("aria-hidden", "true");
reelsEl.appendChild(teaseLayer);
let currentTease = null;   // { lines, last, sym, missed }

function showTease(info, last){
  currentTease = { lines: info.lines, last, sym: info.sym, missed: false };
  info.lines.forEach(line => line.rows.forEach((row, i) => { if(i !== last) markCell(i, row, "is-tease"); }));
  cabinet.classList.add("has-tease");
  drawTease();
}
function drawTease(){
  teaseLayer.innerHTML = "";
  winLinesEl.querySelectorAll(".tease-line").forEach(n => n.remove());
  if(!currentTease || !CELL) return;
  const { lines, last, sym, missed } = currentTease;
  const r = reels[last].el, seen = new Set();
  lines.forEach(line => {
    const pts = line.rows.map((row, i) => { const c = cellCenter(i, row); return `${c.x.toFixed(1)},${c.y.toFixed(1)}`; }).join(" ");
    const pl = document.createElementNS(SVG_NS, "polyline");
    pl.setAttribute("points", pts); pl.setAttribute("class", "tease-line" + (missed ? " missed" : ""));
    winLinesEl.appendChild(pl);
    const row = line.rows[last];
    if(seen.has(row)) return;
    seen.add(row);
    const box = document.createElement("div");
    box.className = "tease-target" + (missed ? " missed" : "");
    Object.assign(box.style, { left: r.offsetLeft + "px", top: (r.offsetTop + CELL * row) + "px", width: r.clientWidth + "px", height: CELL + "px" });
    box.innerHTML = `<img src="${ICON(sym)}" alt="">`;
    teaseLayer.appendChild(box);
  });
}
// ıskalandı: hedef kırmızı olur, simgenin son makarada durduğu en yakın hücre işaretlenir
function markMissed(){
  if(!currentTease) return null;
  currentTease.missed = true;
  const { lines, last, sym } = currentTease;
  const targetRows = lines.map(l => l.rows[last]);
  let best = null;
  for(let row = 0; row < ROWS; row++){
    if(symAt(last, idxOf(reels[last]), row) !== sym) continue;
    const d = Math.min(...targetRows.map(t => Math.abs(t - row)));
    if(!best || d < best.d) best = { row, d };
  }
  if(best) markCell(last, best.row, "is-almost");
  drawTease();
  return best ? best.row : null;
}
function clearTease(){
  currentTease = null; teaseLayer.innerHTML = "";
  winLinesEl.querySelectorAll(".tease-line").forEach(n => n.remove());
  cabinet.classList.remove("has-tease");
  reels.forEach(r => r.cells.forEach(c => c.classList.remove("is-tease", "is-almost")));
}
// "KIL PAYI!" yazısı çerçeveleri kapatmasın: boş kalan üst ya da alt satıra yerleşir
function calloutSpot(extraRow){
  if(!currentTease) return undefined;
  const occ = new Set();
  currentTease.lines.forEach(l => l.rows.forEach(r => occ.add(r)));
  if(extraRow != null) occ.add(extraRow);
  return !occ.has(0) ? "top" : (!occ.has(ROWS - 1) ? "bottom" : "top");
}
function markWinCells(lines){
  lines.forEach(line => line.rows.forEach((row, i) => {
    const r = reels[i], m = mod(idxOf(r) + row - MID, r.n);
    r.cells.forEach((c, k) => { if(k % r.n === m) c.classList.add("is-win"); });
  }));
  cabinet.classList.add("has-win");
}
function cellCenter(reelIdx, row){
  const r = reels[reelIdx].el;
  return { x: r.offsetLeft + r.clientWidth / 2, y: r.offsetTop + CELL * (row + .5) };
}
function drawWinLines(){
  winLinesEl.innerHTML = "";
  if(!currentWin || !CELL) return;
  currentWin.forEach(line => {
    const pts = line.rows.map((row, i) => { const c = cellCenter(i, row); return `${c.x.toFixed(1)},${c.y.toFixed(1)}`; }).join(" ");
    ["under", "over"].forEach(cls => {
      const pl = document.createElementNS(SVG_NS, "polyline");
      pl.setAttribute("points", pts); pl.setAttribute("class", "win-line " + cls);
      winLinesEl.appendChild(pl);
      pl.style.setProperty("--len", Math.ceil(pl.getTotalLength()) + 2);
    });
  });
}
function callout(text, color, pos){
  calloutText.textContent = text;
  calloutEl.style.setProperty("--c", color || "var(--hot)");
  calloutEl.classList.toggle("at-top", pos === "top");
  calloutEl.classList.toggle("at-bottom", pos === "bottom");
  calloutEl.classList.remove("show"); void calloutEl.offsetWidth; calloutEl.classList.add("show");
}
const announce = msg => { liveEl.textContent = ""; setTimeout(() => { liveEl.textContent = msg; }, 50); };

/* =====================================================================
   HAKLAR (localStorage)
   Herkes 10 hakla başlar. Sayaç saat başında değil, CONFIG.REFILL_TIMER_STARTS
   anında başlar (ilk çevirme ya da haklar bitince). REFILL_MINUTES dolunca tüm
   haklar yenilenir ve sayaç durur.

   ÖNEMLİ: Bu sürüm kendi anahtarını kullanır. Eski index4/index5 sürümleri
   "agartha_spins_left" anahtarına yazıyor; aynı tarayıcıda onları oynamış biri
   yeni sayfayı açınca 0 hakla başlıyordu. Eski anahtarlar artık okunmuyor.
   ===================================================================== */
const KEY_STATE = "agartha_luckyspin_spins_v3", KEY_ROUND = "agartha_round_v2";
const refillMs = () => CONFIG.REFILL_MINUTES * 60000;
let spinsLeft = CONFIG.SPIN_LIMIT;
let cycleStart = null;   // sayacın başladığı an (ms) · null = sayaç çalışmıyor
let timerText = "--:--";
const bypass = () => devBypassLimit.checked;

function initSpins(){
  let s = null;
  try { s = JSON.parse(store.get(KEY_STATE)); } catch(e){}
  const now = Date.now();
  const start = s && Number.isFinite(s.start) ? s.start : null;
  const left = s && Number.isFinite(s.left) ? Math.min(CONFIG.SPIN_LIMIT, Math.max(0, Math.floor(s.left))) : CONFIG.SPIN_LIMIT;
  if(start !== null && (start > now + 60000 || now >= start + refillMs())){
    // süre dolmuş ya da cihaz saati ileri/geri alınmış: haklar tam
    spinsLeft = CONFIG.SPIN_LIMIT; cycleStart = null;
  } else if(start === null && CONFIG.REFILL_TIMER_STARTS !== "empty"){
    // çalışan bir sayaç yoksa haklar her zaman tam başlar (ilk giriş dahil)
    spinsLeft = CONFIG.SPIN_LIMIT; cycleStart = null;
  } else {
    spinsLeft = left; cycleStart = start;
    if(spinsLeft <= 0 && cycleStart === null) cycleStart = now;   // olmaması gereken durum: beklemeyi başlat
  }
  saveSpins();
}
function saveSpins(){ store.set(KEY_STATE, JSON.stringify({ left: spinsLeft, start: cycleStart })); updateUI(); }
// ücretli bir çevirme harcanır; ayara göre sayaç ilk çevirmede ya da haklar bitince başlar
function useSpin(){
  spinsLeft--;
  const startNow = CONFIG.REFILL_TIMER_STARTS === "empty" ? spinsLeft <= 0 : true;
  if(cycleStart === null && startNow) cycleStart = Date.now();
  saveSpins(); tickTimer();
}
function refillSpins(){
  spinsLeft = CONFIG.SPIN_LIMIT; cycleStart = null; saveSpins();
}
function checkRefill(loud){
  if(cycleStart === null || Date.now() < cycleStart + refillMs()) return false;
  const wasEmpty = spinsLeft <= 0;
  refillSpins();
  if(loud && wasEmpty){ sfx("refill"); callout("YENİ HAKLAR!", "var(--cyan)"); announce("Hakların yenilendi."); }
  return true;
}
function fmtCountdown(ms){
  const s = Math.ceil(ms / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}
function tickTimer(){
  checkRefill(true);
  const running = cycleStart !== null;
  timerText = fmtCountdown(running ? Math.max(0, cycleStart + refillMs() - Date.now()) : refillMs());
  timerEl.textContent = timerText;
  timerEl.classList.toggle("idle", !running);   // sayaç durmuşken soluk görünür
  if(spinBtn.classList.contains("out")) spinLabel.textContent = timerText;
}

/* =====================================================================
   TUR DURUMU: free spin sayacı + biriken kazançlar (sayfa yenilense de kaybolmaz)
   ===================================================================== */
let round = loadRound();
let phase = "idle";      // idle | busy
let inBonus = false;
const forceQueue = [];

function freshRound(){ return { freeLeft: 0, freeTotal: 0, freeDone: 0, stash: [] }; }
function loadRound(){
  try { const r = JSON.parse(store.get(KEY_ROUND)); if(r && Array.isArray(r.stash)) return Object.assign(freshRound(), r); } catch(e){}
  return freshRound();
}
function saveRound(){ store.set(KEY_ROUND, JSON.stringify(round)); }
function resetRound(){ round = freshRound(); store.del(KEY_ROUND); }
const bonusActive = () => inBonus || round.freeLeft > 0;

/* =====================================================================
   ARAYÜZ GÜNCELLEME
   ===================================================================== */
for(let i = 0; i < CONFIG.SPIN_LIMIT; i++){ const p = document.createElement("span"); p.className = "pip"; pipsEl.appendChild(p); }
let lastPipCount = null;

function updateUI(){
  const free = bypass();
  const bon = bonusActive();
  const out = !free && spinsLeft <= 0 && !bon;
  const sheetOpen = summary.classList.contains("show") || rules.classList.contains("show");
  const canSpin = phase === "idle" && !bon && !out && !sheetOpen;

  const pips = [...pipsEl.children];
  pips.forEach((p, i) => {
    const on = free || i < spinsLeft;
    if(lastPipCount !== null && !on && p.classList.contains("on")){ p.classList.remove("spent"); void p.offsetWidth; p.classList.add("spent"); }
    p.classList.toggle("on", on);
  });
  lastPipCount = spinsLeft;
  spinsNum.textContent = free ? "∞" : spinsLeft;

  spinBtn.disabled = !canSpin;
  spinBtn.classList.toggle("ready", canSpin);
  spinBtn.classList.toggle("bonus", bon);
  spinBtn.classList.toggle("out", out && phase === "idle");
  if(bon){
    spinLabel.textContent = "FREE"; spinSub.textContent = `${round.freeDone}/${round.freeTotal}`;
    spinBtn.setAttribute("aria-label", "Free spinler otomatik dönüyor");
    spinBtn.style.setProperty("--energy", round.freeTotal ? round.freeDone / round.freeTotal : 0);
  } else if(out && phase === "idle"){
    spinLabel.textContent = timerText; spinSub.textContent = "yeni hak";
    spinBtn.setAttribute("aria-label", `Hakkın bitti, ${timerText} sonra yenilenir`);
    spinBtn.style.setProperty("--energy", 0);
  } else {
    spinLabel.textContent = "ÇEVİR"; spinSub.textContent = "";
    spinBtn.setAttribute("aria-label", "Çevir");
    spinBtn.style.setProperty("--energy", motion.energy);
  }
  if(phase === "idle" && !bon) setMode(out ? "off" : "idle");
  updateHint();
}

function updateHint(){
  let t, live = false;
  if(bonusActive()) t = "Free spinler otomatik dönüyor";
  else if(!bypass() && spinsLeft <= 0) t = "Süre dolunca hakların yenilenir";
  else if(motion.live){ t = "Telefonu salla ya da butona dokun"; live = true; }
  else if(motion.denied) t = "Sallama izni kapalı, butona dokun";
  else if(isTouch) t = "Butona dokun";
  else t = "Butona tıkla ya da boşluk tuşuna bas";
  hintEl.textContent = t;
  hintEl.classList.toggle("live", live);
  const outOfSpins = !bypass() && spinsLeft <= 0;
  motionChip.hidden = !(motion.needsPerm && isTouch && !motion.live && !motion.asked && !bonusActive() && !outOfSpins);
}

function updateBonusHud(){
  fsNow.textContent = round.freeDone;
  fsTotal.textContent = round.freeTotal;
  updateUI();
}
function renderStash(popSym){
  const counts = {};
  round.stash.forEach(x => { counts[x.sym] = (counts[x.sym] || 0) + 1; });
  const keys = PRIZE_SYMBOLS.filter(s => counts[s]);
  stashEl.innerHTML = keys.length
    ? keys.map(s => `<span class="stash-item${s === popSym ? " pop" : ""}" data-sym="${s}"><img src="${ICON(s)}" alt="">×${counts[s]}</span>`).join("")
    : `<span class="stash-empty">Kazançlar burada birikir</span>`;
}

/* =====================================================================
   SES MOTORU (Web Audio) — dosya yoksa oyun bozulmaz, o ses atlanır
   ===================================================================== */
const SOUND_DIR = "./sounds/";
const SOUNDS = {
  spinStart  : { files:["spin-start.mp3"], fallback:"lever-pull.mp3", vol:0.8 },
  reelLoop   : { files:["reel-loop.mp3"], fallback:"cark-normal.mp3", vol:0.5, loop:true },
  reelStop   : { files:["reel-stop-1.mp3","reel-stop-2.mp3","reel-stop-3.mp3"], fallback:"thud.mp3", fallbackRate:3, vol:0.85 },
  tick       : { files:["tick.mp3"], vol:0.45 },
  tension    : { files:["tension-loop.mp3"], vol:0.55, loop:true },
  nearMiss   : { files:["near-miss.mp3"], vol:0.75 },
  lose       : { files:["lose.mp3"], vol:0.5 },
  winFreeSpin: { files:["win-free-spin.mp3"], fallback:"jackpot.mp3", vol:0.85 },
  winDiscount: { files:["win-discount.mp3"], fallback:"jackpot.mp3", vol:0.9 },
  winBeer    : { files:["win-beer.mp3"], fallback:"beerwin.mp3", vol:1 },
  confetti   : { files:["confetti.mp3"], vol:0.8 },
  uiClick    : { files:["ui-click.mp3"], vol:0.55 },
  refill     : { files:["refill.mp3"], vol:0.6 },
  ambient    : { files:["ambient-loop.mp3"], vol:0.16, loop:true }
};
const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtxClass({ latencyHint: "interactive" });
const master = audioCtx.createGain();
const comp = audioCtx.createDynamicsCompressor();
comp.threshold.value = -14; comp.knee.value = 24; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
master.connect(comp); comp.connect(audioCtx.destination);

const KEY_MUTE = "agartha_sound_muted";
let muted = store.get(KEY_MUTE) === "1";
master.gain.value = muted ? 0 : 1;
function applyMute(){
  master.gain.setTargetAtTime(muted ? 0 : 1, audioCtx.currentTime, 0.03);
  soundToggle.setAttribute("aria-pressed", String(!muted));
  soundToggle.setAttribute("aria-label", muted ? "Sesi aç" : "Sesi kapat");
  soundToggle.textContent = muted ? "🔇" : "🔊";
}
applyMute();
soundToggle.addEventListener("click", () => { muted = !muted; store.set(KEY_MUTE, muted ? "1" : "0"); applyMute(); if(!muted) sfx("uiClick"); });

const buffers = {}, baseRate = {};
async function loadBuffer(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(res.status);
  const arr = await res.arrayBuffer();
  return new Promise((ok, fail) => audioCtx.decodeAudioData(arr, ok, fail));
}
async function loadSound(key, def){
  const results = await Promise.allSettled(def.files.map(f => loadBuffer(SOUND_DIR + f)));
  let list = results.filter(r => r.status === "fulfilled").map(r => r.value);
  baseRate[key] = 1;
  if(!list.length && def.fallback){
    try { list = [await loadBuffer(SOUND_DIR + def.fallback)]; baseRate[key] = def.fallbackRate || 1; } catch(e){}
  }
  if(list.length) buffers[key] = list;
}
const soundsReady = Promise.all(Object.entries(SOUNDS).map(([k, d]) => loadSound(k, d)));

let unlocked = false;
const UNLOCK_EVENTS = ["pointerdown", "pointerup", "touchend", "click", "keydown"];
function onUnlocked(){
  if(unlocked) return;
  unlocked = true;
  UNLOCK_EVENTS.forEach(ev => window.removeEventListener(ev, unlockAudio, true));
  startAmbient();
}
function unlockAudio(){
  if(audioCtx.state === "running"){ onUnlocked(); return; }
  audioCtx.resume().then(() => { if(audioCtx.state === "running") onUnlocked(); }).catch(() => {});
  try { const b = audioCtx.createBuffer(1, 1, 22050), s = audioCtx.createBufferSource(); s.buffer = b; s.connect(audioCtx.destination); s.start(0); } catch(e){}
}
UNLOCK_EVENTS.forEach(ev => window.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
document.addEventListener("visibilitychange", () => { if(document.hidden) audioCtx.suspend(); else if(unlocked) audioCtx.resume(); });

const active = new Set(), lastVariation = {};
function pickBuffer(key){
  const list = buffers[key];
  if(!list || !list.length) return null;
  if(list.length === 1) return list[0];
  let i; do { i = rand(list.length); } while(i === lastVariation[key]);
  lastVariation[key] = i; return list[i];
}
function sfx(key, opt = {}){
  if(audioCtx.state !== "running") return null;
  const buf = pickBuffer(key); if(!buf) return null;
  const { rate = 1, jitter = 0.04, vol = 1, delay = 0 } = opt;
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  src.playbackRate.value = (baseRate[key] || 1) * rate * (1 + (Math.random() * 2 - 1) * jitter);
  const g = audioCtx.createGain(); g.gain.value = (SOUNDS[key].vol ?? 1) * vol;
  src.connect(g); g.connect(master); src.start(audioCtx.currentTime + delay);
  const h = { src, g }; active.add(h);
  src.onended = () => { active.delete(h); try { g.disconnect(); } catch(e){} };
  return h;
}
function stopActiveSfx(fade = 0.08){
  const t = audioCtx.currentTime;
  active.forEach(h => { try { h.g.gain.cancelScheduledValues(t); h.g.gain.setTargetAtTime(0, t, fade / 3); h.src.stop(t + fade); } catch(e){} });
}
const loops = {};
function startLoop(key, { fade = 0.1, vol = 1 } = {}){
  if(!buffers[key] || loops[key] || audioCtx.state !== "running") return;
  const src = audioCtx.createBufferSource(); src.buffer = buffers[key][0]; src.loop = true;
  const g = audioCtx.createGain(); g.gain.value = 0; src.connect(g); g.connect(master); src.start();
  const base = (SOUNDS[key].vol ?? 1) * vol;
  g.gain.setTargetAtTime(base, audioCtx.currentTime, fade / 3);
  loops[key] = { src, g, base };
}
function setLoopLevel(key, level, fade = 0.2){ const l = loops[key]; if(l) l.g.gain.setTargetAtTime(l.base * level, audioCtx.currentTime, fade / 3); }
function stopLoop(key, fade = 0.15){
  const l = loops[key]; if(!l) return; loops[key] = null;
  const t = audioCtx.currentTime;
  l.g.gain.cancelScheduledValues(t); l.g.gain.setTargetAtTime(0, t, fade / 3);
  try { l.src.stop(t + fade + 0.05); } catch(e){}
  l.src.onended = () => { try { l.g.disconnect(); } catch(e){} };
}
function startAmbient(){ if(unlocked) startLoop("ambient", { fade: 3 }); }
